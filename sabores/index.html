<!-- (17-sep-2026, Iago) PENTAGRAMAS QUE CABEN. VexFlow dibuja el pentagrama con un
     ancho fijo metido en el propio SVG (style="width:920px"), que pisa al CSS. En iPad en
     vertical la caja es mas estrecha y tiene el desplazamiento bloqueado, asi que las
     ultimas notas quedaban cortadas y sin forma de llegar a ellas (lo que una alumna
     describio como "no me deja avanzar a la derecha", 16-sep-2026). Aqui se le quita ese
     ancho fijo y se deja que el viewBox escale el MISMO dibujo al ancho que haya.
     Solo toca los SVG grandes: los iconos (24 px) no se tocan. -->
<script>
(function(){
  function ajusta(sv){
    try{
      if(!sv || !sv.style) return;
      var w=parseFloat(sv.getAttribute('width')||sv.style.width||0);
      if(!w || w < 300) return;                       // iconos y cosas pequenas, fuera
      if(!sv.getAttribute('viewBox')){
        var h=parseFloat(sv.getAttribute('height')||sv.style.height||0);
        if(!h) return;
        sv.setAttribute('viewBox','0 0 '+w+' '+h);
      }
      sv.setAttribute('preserveAspectRatio','xMinYMin meet');
      sv.removeAttribute('width'); sv.removeAttribute('height');
      sv.style.width='100%'; sv.style.height='auto'; sv.style.maxWidth='100%';
    }catch(e){}
  }
  function pasada(){ try{ document.querySelectorAll('svg').forEach(ajusta); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',pasada); else pasada();
  addEventListener('load',pasada);
  try{
    new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){
        var m=ms[i];
        if(m.type==='attributes'){ if(m.target && String(m.target.tagName).toLowerCase()==='svg') ajusta(m.target); continue; }
        var a=m.addedNodes;
        for(var j=0;j<a.length;j++){
          var n=a[j]; if(!n || n.nodeType!==1) continue;
          if(String(n.tagName).toLowerCase()==='svg') ajusta(n);
          else if(n.querySelectorAll) n.querySelectorAll('svg').forEach(ajusta);
        }
      }
    }).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['width','height','style']});
  }catch(e){}
})();
</script>
